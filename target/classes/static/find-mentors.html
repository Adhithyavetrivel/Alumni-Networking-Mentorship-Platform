<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Mentors - Alumni Networking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold mb-1">Find Alumni Mentors</h2>
          <p class="text-muted mb-0">Discover verified alumni, explore match scores, and request career guidance.</p>
        </div>

        <!-- View mode tabs -->
        <div class="btn-group shadow-sm" role="group">
          <button type="button" class="btn btn-outline-primary active" id="btnRecommended" onclick="switchView('recommended')">
            <i class="bi bi-stars me-1"></i> Recommended For Me
          </button>
          <button type="button" class="btn btn-outline-primary" id="btnAll" onclick="switchView('all')">
            <i class="bi bi-grid me-1"></i> All Mentors
          </button>
        </div>
      </div>

      <!-- Search & Filter Form -->
      <div class="card-custom mb-4">
        <div class="card-body">
          <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Skill</label>
              <input type="text" class="form-control form-control-sm" id="filterSkill" placeholder="e.g. Java, Python, AWS">
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Company</label>
              <input type="text" class="form-control form-control-sm" id="filterCompany" placeholder="e.g. Google, Amazon">
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Job Role</label>
              <input type="text" class="form-control form-control-sm" id="filterJobRole" placeholder="e.g. Software Engineer">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Department</label>
              <select class="form-select form-select-sm" id="filterDepartment">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="col-md-2 d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm flex-fill">
                <i class="bi bi-search me-1"></i> Search
              </button>
              <button type="button" class="btn btn-light btn-sm" onclick="resetFilters()">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Mentor List / Grid -->
      <div id="mentorsLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">Loading mentors...</p>
      </div>

      <div id="mentorContainer" class="row g-4 d-none">
        <!-- Dynamically filled with mentor cards -->
      </div>

      <div id="noMentorsFound" class="text-center py-5 d-none">
        <i class="bi bi-search text-muted fs-1 mb-3"></i>
        <h5>No mentors match your criteria</h5>
        <p class="text-muted small">Try broadening your search or resetting the filters.</p>
        <button class="btn btn-outline-primary btn-sm" onclick="resetFilters()">Reset Filters</button>
      </div>
    </main>
  </div>

  <!-- Request Mentorship Modal -->
  <div class="modal fade" id="requestModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold"><i class="bi bi-send-fill text-primary me-2"></i>Send Mentorship Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="p-3 bg-light rounded-3 mb-3">
            <div class="fw-bold" id="modalAlumniName">Mentor Name</div>
            <div class="small text-muted" id="modalAlumniDetails">Role at Company</div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Personalized Message *</label>
            <textarea class="form-control" id="requestMessage" rows="4" placeholder="Introduce yourself, mention what topics you'd like guidance on, and why you are reaching out to this mentor..."></textarea>
          </div>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="btnSendRequest" class="btn btn-primary" onclick="submitMentorshipRequest()">
            Send Request
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let currentView = 'recommended';
    let targetAlumniId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['STUDENT', 'ADMIN']);
      if (!user) return;

      API.renderNavbar('find-mentors');
      API.renderSidebar('STUDENT', 'find-mentors');
      await loadDepartments();
      await loadMentors();
    });

    async function loadDepartments() {
      try {
        const depts = await API.get('/api/departments');
        const sel = document.getElementById('filterDepartment');
        depts.forEach(d => {
          sel.innerHTML += `<option value="${d.name}">${d.name}</option>`;
        });
      } catch (e) {}
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('btnRecommended').classList.toggle('active', view === 'recommended');
      document.getElementById('btnAll').classList.toggle('active', view === 'all');
      loadMentors();
    }

    async function loadMentors() {
      const loading = document.getElementById('mentorsLoading');
      const container = document.getElementById('mentorContainer');
      const noFound = document.getElementById('noMentorsFound');

      loading.classList.remove('d-none');
      container.classList.add('d-none');
      noFound.classList.add('d-none');

      try {
        if (currentView === 'recommended') {
          const recs = await API.get('/api/students/recommendations');
          loading.classList.add('d-none');
          if (!recs || recs.length === 0) {
            noFound.classList.remove('d-none');
            return;
          }
          container.classList.remove('d-none');
          container.innerHTML = recs.map(r => renderMentorCard(r.alumni, r.matchPercentage, r.skillMatchScore, r.interestMatchScore, r.careerGoalMatchScore)).join('');
        } else {
          const skill = document.getElementById('filterSkill').value;
          const company = document.getElementById('filterCompany').value;
          const jobRole = document.getElementById('filterJobRole').value;
          const department = document.getElementById('filterDepartment').value;

          let query = `?skill=${encodeURIComponent(skill)}&company=${encodeURIComponent(company)}&jobRole=${encodeURIComponent(jobRole)}&department=${encodeURIComponent(department)}`;
          const alumni = await API.get('/api/students/alumni/search' + query);
          loading.classList.add('d-none');

          if (!alumni || alumni.length === 0) {
            noFound.classList.remove('d-none');
            return;
          }
          container.classList.remove('d-none');
          container.innerHTML = alumni.map(a => renderMentorCard(a, null)).join('');
        }
      } catch (err) {
        loading.innerHTML = `<p class="text-danger small">Error loading mentors: ${err.message}</p>`;
      }
    }

    function renderMentorCard(alumni, matchPct = null, skillScore = null, interestScore = null, goalScore = null) {
      const ratingStars = alumni.averageRating > 0
        ? `<span class="star-rating"><i class="bi bi-star-fill"></i> ${alumni.averageRating}</span> <span class="text-muted small">(${alumni.totalReviews} reviews)</span>`
        : `<span class="text-muted small">No reviews yet</span>`;

      let matchHtml = '';
      if (matchPct !== null) {
        matchHtml = `
          <div class="mb-2">
            <span class="match-badge">
              <i class="bi bi-bullseye"></i> ${matchPct}% Match
            </span>
            <span class="text-muted small ms-2">(Skills: ${skillScore}%, Interests: ${interestScore}%, Goal: ${goalScore}%)</span>
          </div>
        `;
      }

      return `
        <div class="col-md-6 col-lg-4">
          <div class="card card-custom h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h5 class="fw-bold mb-0">${alumni.name}</h5>
                  <div class="text-primary small fw-semibold">${alumni.jobRole}</div>
                  <div class="text-muted small fw-medium">${alumni.company}</div>
                </div>
                <span class="badge bg-success-subtle text-success border border-success-subtle"><i class="bi bi-patch-check-fill me-1"></i>Verified</span>
              </div>

              ${matchHtml}

              <div class="mb-2 small">
                ${ratingStars}
              </div>

              <div class="small text-muted mb-2">
                <i class="bi bi-mortarboard me-1"></i> Class of ${alumni.graduationYear} &bull; ${alumni.department || 'Engineering'}
              </div>

              <div class="small mb-3">
                <strong class="text-dark">Skills:</strong>
                <span class="text-muted">${alumni.skills || 'N/A'}</span>
              </div>

              <div class="mt-auto pt-3 border-top d-flex gap-2">
                <a href="/mentor-profile.html?id=${alumni.id}" class="btn btn-outline-primary btn-sm flex-fill">
                  View Profile
                </a>
                <button class="btn btn-primary btn-sm flex-fill" onclick="openRequestModal(${alumni.userId}, '${alumni.name}', '${alumni.jobRole} at ${alumni.company}')">
                  Request Mentorship
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById('filterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      currentView = 'all';
      document.getElementById('btnRecommended').classList.remove('active');
      document.getElementById('btnAll').classList.add('active');
      loadMentors();
    });

    function resetFilters() {
      document.getElementById('filterSkill').value = '';
      document.getElementById('filterCompany').value = '';
      document.getElementById('filterJobRole').value = '';
      document.getElementById('filterDepartment').value = '';
      loadMentors();
    }

    function openRequestModal(userId, name, details) {
      targetAlumniId = userId;
      document.getElementById('modalAlumniName').textContent = name;
      document.getElementById('modalAlumniDetails').textContent = details;
      document.getElementById('requestMessage').value = '';
      const modal = new bootstrap.Modal(document.getElementById('requestModal'));
      modal.show();
    }

    async function submitMentorshipRequest() {
      const message = document.getElementById('requestMessage').value.trim();
      if (!message) {
        alert('Please write a brief message for the mentor.');
        return;
      }

      const btn = document.getElementById('btnSendRequest');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await API.post('/api/mentorship/request', {
          alumniId: targetAlumniId,
          message: message
        });
        API.showToast('Mentorship request sent successfully!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
      } catch (err) {
        alert(err.message || 'Failed to send request.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Request';
      }
    }
  </script>
</body>
</html>
