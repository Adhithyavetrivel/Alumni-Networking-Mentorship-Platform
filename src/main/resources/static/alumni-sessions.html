<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Sessions - Alumni Networking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Mentoring Sessions</h2>
          <p class="text-muted mb-0">Confirm requested sessions, conduct 1-on-1 calls, and view student feedback.</p>
        </div>
        <button class="btn btn-primary" onclick="openAlumniScheduleModal()">
          <i class="bi bi-calendar-plus me-1"></i> Propose Session
        </button>
      </div>

      <div class="card-custom">
        <div class="card-header">
          <span><i class="bi bi-calendar3 text-primary me-2"></i>All Sessions</span>
        </div>
        <div class="card-body p-0">
          <div id="sessionsLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive d-none" id="tableContainer">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Topic</th>
                  <th>Student Mentee</th>
                  <th>Date & Time</th>
                  <th>Status</th>
                  <th>Student Feedback</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="sessionsTbody"></tbody>
            </table>
          </div>

          <div id="noSessionsMsg" class="text-center py-5 d-none">
            <i class="bi bi-calendar-x text-muted fs-1 mb-2"></i>
            <h5>No sessions scheduled yet</h5>
            <p class="text-muted small">Your mentees' session requests will appear here.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Schedule Modal for Alumni -->
  <div class="modal fade" id="alumniScheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold"><i class="bi bi-calendar-plus text-primary me-2"></i>Schedule Mentoring Session</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="alumniScheduleForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Select Mentee *</label>
              <select class="form-select" id="as_request" required>
                <option value="">Select an active mentee...</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Session Topic *</label>
              <input type="text" class="form-control" id="as_topic" placeholder="e.g. System Design Mock Interview" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Date & Time *</label>
              <input type="datetime-local" class="form-control" id="as_date" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Agenda / Notes</label>
              <textarea class="form-control" id="as_desc" rows="3" placeholder="Brief outline for the mentee..."></textarea>
            </div>
            <div class="modal-footer border-top px-0 pb-0">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Create Session</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allSessions = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ALUMNI', 'ADMIN']);
      if (!user) return;

      API.renderNavbar('sessions');
      API.renderSidebar('ALUMNI', 'sessions');
      await loadSessions();
    });

    async function loadSessions() {
      try {
        allSessions = await API.get('/api/sessions');
        document.getElementById('sessionsLoading').classList.add('d-none');
        renderTable();
      } catch (err) {
        document.getElementById('sessionsLoading').innerHTML = `<p class="text-danger small">Failed to load sessions: ${err.message}</p>`;
      }
    }

    function renderTable() {
      const container = document.getElementById('tableContainer');
      const tbody = document.getElementById('sessionsTbody');
      const noSess = document.getElementById('noSessionsMsg');

      if (allSessions.length === 0) {
        container.classList.add('d-none');
        noSess.classList.remove('d-none');
        return;
      }

      container.classList.remove('d-none');
      noSess.classList.add('d-none');

      tbody.innerHTML = allSessions.map(s => {
        let badgeClass = 'badge-pending';
        if (s.status === 'CONFIRMED') badgeClass = 'badge-confirmed';
        else if (s.status === 'COMPLETED') badgeClass = 'badge-completed';
        else if (s.status === 'CANCELLED') badgeClass = 'badge-cancelled';

        let fbHtml = '';
        if (s.status === 'COMPLETED') {
          if (s.feedbackSubmitted) {
            fbHtml = `
              <div>
                <span class="text-warning fw-bold">★ ${s.rating}/5</span>
                <p class="small text-muted mb-0 fst-italic">"${s.feedbackComment || ''}"</p>
              </div>
            `;
          } else {
            fbHtml = `<span class="text-muted small">Pending student feedback</span>`;
          }
        } else {
          fbHtml = `<span class="text-muted small">-</span>`;
        }

        let actions = '';
        if (s.status === 'REQUESTED') {
          actions = `
            <button class="btn btn-sm btn-success me-1" onclick="confirmSession(${s.id})"><i class="bi bi-check2"></i> Confirm</button>
            <button class="btn btn-sm btn-outline-danger" onclick="cancelSession(${s.id})"><i class="bi bi-x"></i> Cancel</button>
          `;
        } else if (s.status === 'CONFIRMED') {
          actions = `
            <button class="btn btn-sm btn-outline-success me-1" onclick="completeSession(${s.id})"><i class="bi bi-check2-circle"></i> Mark Complete</button>
            <button class="btn btn-sm btn-outline-danger" onclick="cancelSession(${s.id})"><i class="bi bi-x"></i> Cancel</button>
          `;
        }

        return `
          <tr>
            <td class="ps-4">
              <div class="fw-bold">${s.topic}</div>
              <div class="text-muted small text-truncate" style="max-width: 200px;">${s.description || 'No notes'}</div>
            </td>
            <td>
              <div class="fw-semibold">${s.studentName}</div>
              <div class="text-muted small">${s.studentEmail}</div>
            </td>
            <td>
              <div class="text-primary fw-medium">${API.formatDate(s.sessionDate)}</div>
            </td>
            <td>
              <span class="badge ${badgeClass}">${s.status}</span>
            </td>
            <td>
              ${fbHtml}
            </td>
            <td class="text-end pe-4 text-nowrap">
              ${actions}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function confirmSession(id) {
      try {
        await API.put(`/api/sessions/${id}/confirm`);
        API.showToast('Session confirmed!', 'success');
        await loadSessions();
      } catch (err) {
        alert(err.message || 'Failed to confirm session.');
      }
    }

    async function completeSession(id) {
      if (!confirm('Mark this mentoring session as completed?')) return;
      try {
        await API.put(`/api/sessions/${id}/complete`);
        API.showToast('Session marked as completed.', 'success');
        await loadSessions();
      } catch (err) {
        alert(err.message || 'Failed to complete session.');
      }
    }

    async function cancelSession(id) {
      if (!confirm('Are you sure you want to cancel this session?')) return;
      try {
        await API.put(`/api/sessions/${id}/cancel`);
        API.showToast('Session cancelled.', 'info');
        await loadSessions();
      } catch (err) {
        alert(err.message || 'Failed to cancel session.');
      }
    }

    async function openAlumniScheduleModal() {
      const select = document.getElementById('as_request');
      select.innerHTML = '<option value="">Select an active mentee...</option>';

      try {
        const requests = await API.get('/api/mentorship/alumni');
        const accepted = requests.filter(r => r.status === 'ACCEPTED');

        if (accepted.length === 0) {
          alert('You do not have any active mentees yet. Accept incoming requests first.');
          return;
        }

        accepted.forEach(r => {
          select.innerHTML += `<option value="${r.id}">${r.studentName} (${r.studentDepartment || 'Student'})</option>`;
        });

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(19, 0, 0, 0);
        document.getElementById('as_date').value = tomorrow.toISOString().slice(0, 16);

        const modal = new bootstrap.Modal(document.getElementById('alumniScheduleModal'));
        modal.show();
      } catch (err) {
        alert('Failed to load mentees: ' + err.message);
      }
    }

    document.getElementById('alumniScheduleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mentorshipRequestId = document.getElementById('as_request').value;
      const topic = document.getElementById('as_topic').value.trim();
      const sessionDate = document.getElementById('as_date').value;
      const description = document.getElementById('as_desc').value.trim();

      try {
        await API.post('/api/sessions', {
          mentorshipRequestId,
          topic,
          sessionDate,
          description
        });
        API.showToast('Session created and confirmed!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('alumniScheduleModal')).hide();
        await loadSessions();
      } catch (err) {
        alert(err.message || 'Failed to create session.');
      }
    });
  </script>
</body>
</html>
