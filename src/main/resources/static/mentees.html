<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Mentees - Alumni Networking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Active Mentees</h2>
          <p class="text-muted mb-0">Students who you are currently mentoring through accepted mentorship applications.</p>
        </div>
      </div>

      <div id="menteesLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>

      <div id="menteesGrid" class="row g-4 d-none">
        <!-- Dynamically populated -->
      </div>

      <div id="noMenteesMsg" class="text-center py-5 d-none">
        <i class="bi bi-people text-muted fs-1 mb-2"></i>
        <h5>No active mentees yet</h5>
        <p class="text-muted small">Accept incoming student requests to start mentoring.</p>
        <a href="/incoming-requests.html" class="btn btn-outline-primary btn-sm">View Incoming Requests</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ALUMNI', 'ADMIN']);
      if (!user) return;

      API.renderNavbar('mentees');
      API.renderSidebar('ALUMNI', 'mentees');
      await loadMentees();
    });

    async function loadMentees() {
      const loading = document.getElementById('menteesLoading');
      const grid = document.getElementById('menteesGrid');
      const noMentees = document.getElementById('noMenteesMsg');

      try {
        const mentees = await API.get('/api/alumni/mentees');
        loading.classList.add('d-none');

        if (!mentees || mentees.length === 0) {
          noMentees.classList.remove('d-none');
          return;
        }

        grid.classList.remove('d-none');
        grid.innerHTML = mentees.map(m => `
          <div class="col-md-6 col-lg-4">
            <div class="card card-custom h-100 shadow-sm border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-3">
                  <div class="stat-icon-wrapper bg-primary-subtle text-primary rounded-circle" style="width: 48px; height: 48px;">
                    <i class="bi bi-mortarboard-fill fs-4"></i>
                  </div>
                  <div>
                    <h5 class="fw-bold mb-0">${m.name}</h5>
                    <div class="small text-muted">${m.email}</div>
                  </div>
                </div>

                <div class="small text-muted mb-2">
                  <i class="bi bi-building me-1"></i> ${m.department || 'Engineering'} &bull; Class of ${m.graduationYear || 'N/A'}
                </div>

                <div class="small mb-2">
                  <strong class="text-dark">Career Goal:</strong>
                  <span class="badge bg-primary-subtle text-primary ms-1">${m.careerGoal || 'Not specified'}</span>
                </div>

                <div class="small mb-2">
                  <strong class="text-dark">Interests:</strong>
                  <span class="text-muted">${m.interests || 'N/A'}</span>
                </div>

                <div class="small mb-3">
                  <strong class="text-dark">Skills:</strong>
                  <span class="text-muted">${m.skills || 'N/A'}</span>
                </div>

                ${m.bio ? `<p class="small text-muted bg-light p-2 rounded-2 mb-3 fst-italic">"${m.bio}"</p>` : ''}

                <div class="mt-auto pt-3 border-top d-flex gap-2">
                  <a href="/alumni-sessions.html" class="btn btn-outline-primary btn-sm w-100">
                    <i class="bi bi-calendar-event me-1"></i> Sessions
                  </a>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        loading.innerHTML = `<p class="text-danger small">Failed to load mentees: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
