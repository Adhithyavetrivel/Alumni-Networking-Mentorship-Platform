<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Alumni - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold mb-1">Manage Alumni & Verification</h2>
          <p class="text-muted mb-0">Verify alumni credentials, review employment history, and manage platform access.</p>
        </div>
        <div class="input-group" style="max-width: 300px;">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchAlumni" placeholder="Search alumni..." oninput="filterAlumni()">
        </div>
      </div>

      <div class="card-custom">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs" id="statusTabs">
            <li class="nav-item">
              <a class="nav-link active" href="javascript:void(0)" onclick="setFilter('ALL')">All Alumni</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="setFilter('PENDING')">Pending Verification</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="setFilter('VERIFIED')">Verified</a>
            </li>
          </ul>
        </div>
        <div class="card-body p-0">
          <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive d-none" id="tableContainer">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Alumni</th>
                  <th>Company & Role</th>
                  <th>Experience</th>
                  <th>Grad Year & Dept</th>
                  <th>Status</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="alumniTbody"></tbody>
            </table>
          </div>

          <div id="noAlumni" class="text-center py-5 d-none">
            <i class="bi bi-person-check text-muted fs-1 mb-2"></i>
            <p class="text-muted mb-0">No alumni accounts found in this view.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allAlumni = [];
    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ADMIN']);
      if (!user) return;

      API.renderNavbar('alumni');
      API.renderSidebar('ADMIN', 'alumni');
      await loadAlumni();
    });

    async function loadAlumni() {
      try {
        allAlumni = await API.get('/api/admin/alumni');
        document.getElementById('loading').classList.add('d-none');
        renderTable();
      } catch (err) {
        document.getElementById('loading').innerHTML = `<p class="text-danger small">Failed to load alumni: ${err.message}</p>`;
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('#statusTabs .nav-link').forEach(link => {
        link.classList.remove('active');
        if (filter === 'ALL' && link.textContent.includes('All')) link.classList.add('active');
        if (filter === 'PENDING' && link.textContent.includes('Pending')) link.classList.add('active');
        if (filter === 'VERIFIED' && link.textContent.includes('Verified')) link.classList.add('active');
      });
      renderTable();
    }

    function filterAlumni() {
      renderTable();
    }

    function renderTable() {
      const container = document.getElementById('tableContainer');
      const tbody = document.getElementById('alumniTbody');
      const noAl = document.getElementById('noAlumni');
      const q = document.getElementById('searchAlumni').value.toLowerCase();

      let list = allAlumni;
      if (currentFilter === 'PENDING') {
        list = list.filter(a => !a.verified);
      } else if (currentFilter === 'VERIFIED') {
        list = list.filter(a => a.verified);
      }

      if (q) {
        list = list.filter(a =>
          (a.name && a.name.toLowerCase().includes(q)) ||
          (a.email && a.email.toLowerCase().includes(q)) ||
          (a.company && a.company.toLowerCase().includes(q)) ||
          (a.jobRole && a.jobRole.toLowerCase().includes(q)) ||
          (a.department && a.department.toLowerCase().includes(q))
        );
      }

      if (list.length === 0) {
        container.classList.add('d-none');
        noAl.classList.remove('d-none');
        return;
      }

      container.classList.remove('d-none');
      noAl.classList.add('d-none');

      tbody.innerHTML = list.map(a => {
        const statusBadge = a.verified
          ? `<span class="badge badge-verified"><i class="bi bi-patch-check-fill me-1"></i>Verified</span>`
          : `<span class="badge badge-unverified"><i class="bi bi-clock-history me-1"></i>Pending</span>`;

        const verifyBtn = a.verified
          ? `<button class="btn btn-sm btn-outline-warning me-1" onclick="toggleVerification(${a.id}, false)">Unverify</button>`
          : `<button class="btn btn-sm btn-success me-1" onclick="toggleVerification(${a.id}, true)"><i class="bi bi-check-lg me-1"></i>Verify</button>`;

        return `
          <tr>
            <td class="ps-4">
              <div class="fw-bold">${a.name}</div>
              <div class="text-muted small">${a.email}</div>
            </td>
            <td>
              <div class="fw-semibold">${a.jobRole || 'Alumni'}</div>
              <div class="text-muted small"><strong>${a.company || 'N/A'}</strong></div>
            </td>
            <td>
              <span class="small">${a.experience || 0} Years</span>
            </td>
            <td>
              <div class="small fw-medium">${a.department || 'Engineering'}</div>
              <div class="text-muted small">Class of ${a.graduationYear || 'N/A'}</div>
            </td>
            <td>
              ${statusBadge}
            </td>
            <td class="text-end pe-4 text-nowrap">
              ${verifyBtn}
              <button class="btn btn-sm btn-outline-danger" onclick="deleteAlumni(${a.userId}, '${a.name}')">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function toggleVerification(profileId, verify) {
      try {
        await API.put(`/api/admin/alumni/${profileId}/verify`, { verified: verify });
        API.showToast(`Alumni profile ${verify ? 'verified' : 'unverified'} successfully!`, 'success');
        await loadAlumni();
      } catch (err) {
        alert(err.message || 'Failed to update verification.');
      }
    }

    async function deleteAlumni(userId, name) {
      if (!confirm(`Are you sure you want to delete alumni account: ${name}?`)) return;
      try {
        await API.delete(`/api/admin/users/${userId}`);
        API.showToast('Alumni account deleted.', 'success');
        await loadAlumni();
      } catch (err) {
        alert(err.message || 'Failed to delete user.');
      }
    }
  </script>
</body>
</html>
