<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reports - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Safety & Reported Profiles</h2>
          <p class="text-muted mb-0">Review user feedback, investigate misconduct reports, and resolve safety flags.</p>
        </div>
      </div>

      <div class="card-custom">
        <div class="card-header">
          <span><i class="bi bi-shield-exclamation text-danger me-2"></i>Reported Profiles Queue</span>
        </div>
        <div class="card-body p-0">
          <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive d-none" id="tableContainer">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Reported User</th>
                  <th>Reason</th>
                  <th>Description</th>
                  <th>Reported By</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="reportsTbody"></tbody>
            </table>
          </div>

          <div id="noReports" class="text-center py-5 d-none">
            <i class="bi bi-shield-check text-success fs-1 mb-2"></i>
            <h5>All clear!</h5>
            <p class="text-muted small mb-0">No pending reports or reported profiles require attention.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let reportsList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ADMIN']);
      if (!user) return;

      API.renderNavbar('reports');
      API.renderSidebar('ADMIN', 'reports');
      await loadReports();
    });

    async function loadReports() {
      try {
        reportsList = await API.get('/api/admin/reports');
        document.getElementById('loading').classList.add('d-none');
        renderTable();
      } catch (err) {
        document.getElementById('loading').innerHTML = `<p class="text-danger small">Failed to load reports: ${err.message}</p>`;
      }
    }

    function renderTable() {
      const container = document.getElementById('tableContainer');
      const tbody = document.getElementById('reportsTbody');
      const noRep = document.getElementById('noReports');

      if (reportsList.length === 0) {
        container.classList.add('d-none');
        noRep.classList.remove('d-none');
        return;
      }

      container.classList.remove('d-none');
      noRep.classList.add('d-none');

      tbody.innerHTML = reportsList.map(r => {
        let badgeClass = 'badge-pending';
        if (r.status === 'RESOLVED') badgeClass = 'badge-resolved';
        else if (r.status === 'DISMISSED') badgeClass = 'badge-dismissed';

        return `
          <tr>
            <td class="ps-4">
              <div class="fw-bold text-dark">${r.reportedUserName || 'User #' + r.reportedUserId}</div>
              <div class="text-muted small">User ID: ${r.reportedUserId}</div>
            </td>
            <td>
              <span class="badge bg-danger-subtle text-danger border border-danger-subtle">${r.reason}</span>
            </td>
            <td>
              <span class="d-inline-block text-truncate small" style="max-width: 250px;" title="${r.description || ''}">
                ${r.description || 'No description'}
              </span>
            </td>
            <td>
              <div class="small fw-semibold">${r.reporterName}</div>
            </td>
            <td class="small text-muted">${API.formatDate(r.createdAt)}</td>
            <td>
              <span class="badge ${badgeClass}">${r.status}</span>
            </td>
            <td class="text-end pe-4 text-nowrap">
              <div class="btn-group">
                <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                  Status
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                  <li><a class="dropdown-item" href="javascript:void(0)" onclick="updateStatus(${r.id}, 'REVIEWED')">Mark Reviewed</a></li>
                  <li><a class="dropdown-item text-success" href="javascript:void(0)" onclick="updateStatus(${r.id}, 'RESOLVED')">Mark Resolved</a></li>
                  <li><a class="dropdown-item text-muted" href="javascript:void(0)" onclick="updateStatus(${r.id}, 'DISMISSED')">Dismiss</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="deleteReportedUser(${r.reportedUserId}, '${r.reportedUserName}')">Delete User Account</a></li>
                </ul>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateStatus(id, status) {
      try {
        await API.put(`/api/admin/reports/${id}`, { status });
        API.showToast(`Report updated to ${status}.`, 'info');
        await loadReports();
      } catch (err) {
        alert(err.message || 'Failed to update report.');
      }
    }

    async function deleteReportedUser(userId, name) {
      if (!confirm(`Delete reported user account: ${name}? This action cannot be undone.`)) return;
      try {
        await API.delete(`/api/admin/users/${userId}`);
        API.showToast('Reported user deleted from platform.', 'success');
        await loadReports();
      } catch (err) {
        alert(err.message || 'Failed to delete user.');
      }
    }
  </script>
</body>
</html>
