<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Alumni Networking Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="navbar-placeholder"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon-wrapper bg-primary-subtle text-primary mx-auto mb-3">
              <i class="bi bi-box-arrow-in-right fs-2"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to your Alumni Networking account</p>
          </div>

          <div id="error-alert" class="alert alert-danger d-none py-2" role="alert"></div>
          <div id="success-alert" class="alert alert-success d-none py-2" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
              <span id="btnText">Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center">
            <p class="text-muted small mb-2">Or select a demo account:</p>
            <div class="d-flex flex-wrap justify-content-center gap-1">
              <button class="demo-badge border-0" onclick="fillCredentials('admin@alumni.com', 'admin123')">
                <i class="bi bi-shield-lock me-1"></i>Admin
              </button>
              <button class="demo-badge border-0" onclick="fillCredentials('priya@student.com', 'student123')">
                <i class="bi bi-mortarboard me-1"></i>Student (Priya)
              </button>
              <button class="demo-badge border-0" onclick="fillCredentials('rahul.sharma@google.com', 'alumni123')">
                <i class="bi bi-briefcase me-1"></i>Alumni (Google)
              </button>
            </div>
          </div>

          <div class="text-center mt-4">
            <span class="text-muted small">Don't have an account? </span>
            <a href="/register.html" class="fw-semibold text-decoration-none">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 Alumni Networking & Mentorship Platform</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      API.renderNavbar('login');

      // Check query param
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role');
      if (roleParam === 'admin') fillCredentials('admin@alumni.com', 'admin123');
      else if (roleParam === 'student') fillCredentials('priya@student.com', 'student123');
      else if (roleParam === 'alumni') fillCredentials('rahul.sharma@google.com', 'alumni123');
      else if (roleParam === 'alumni2') fillCredentials('divya.krishnan@microsoft.com', 'alumni123');

      if (urlParams.get('registered')) {
        const succAlert = document.getElementById('success-alert');
        succAlert.textContent = 'Account created successfully! Please sign in.';
        succAlert.classList.remove('d-none');
      }
    });

    function fillCredentials(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errAlert = document.getElementById('error-alert');
      const succAlert = document.getElementById('success-alert');
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      errAlert.classList.add('d-none');
      succAlert.classList.add('d-none');
      btn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await API.post('/api/auth/login', { email, password });
        API.setCurrentUser(response);

        succAlert.textContent = 'Login successful! Redirecting...';
        succAlert.classList.remove('d-none');

        setTimeout(() => {
          if (response.role === 'STUDENT') {
            window.location.href = '/student-dashboard.html';
          } else if (response.role === 'ALUMNI') {
            window.location.href = '/alumni-dashboard.html';
          } else if (response.role === 'ADMIN') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 600);
      } catch (err) {
        errAlert.textContent = err.message || 'Login failed. Please check your credentials.';
        errAlert.classList.remove('d-none');
        btn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
