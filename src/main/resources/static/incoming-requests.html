<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incoming Mentorship Requests - Alumni Networking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Incoming Mentorship Requests</h2>
          <p class="text-muted mb-0">Review requests from students seeking your technical guidance and career advice.</p>
        </div>
      </div>

      <div class="card-custom">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs" id="statusTabs">
            <li class="nav-item">
              <a class="nav-link active" href="javascript:void(0)" onclick="filterRequests('ALL')">All</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('PENDING')">Pending</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('ACCEPTED')">Accepted</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('REJECTED')">Rejected</a>
            </li>
          </ul>
        </div>
        <div class="card-body p-0">
          <div id="loadingSpinner" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive d-none" id="tableWrapper">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Student</th>
                  <th>Department</th>
                  <th>Message</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="requestsTbody"></tbody>
            </table>
          </div>

          <div id="noRequestsMsg" class="text-center py-5 d-none">
            <i class="bi bi-inbox text-muted fs-1 mb-2"></i>
            <p class="text-muted mb-0">No incoming mentorship requests found in this category.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allRequests = [];
    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ALUMNI', 'ADMIN']);
      if (!user) return;

      API.renderNavbar('incoming-requests');
      API.renderSidebar('ALUMNI', 'requests');
      await loadRequests();
    });

    async function loadRequests() {
      try {
        allRequests = await API.get('/api/mentorship/alumni');
        document.getElementById('loadingSpinner').classList.add('d-none');
        renderTable();
      } catch (err) {
        document.getElementById('loadingSpinner').innerHTML = `<p class="text-danger small">Failed to load requests: ${err.message}</p>`;
      }
    }

    function filterRequests(status) {
      currentFilter = status;
      document.querySelectorAll('#statusTabs .nav-link').forEach(link => {
        link.classList.toggle('active', link.textContent.trim().toUpperCase() === status);
      });
      renderTable();
    }

    function renderTable() {
      const wrapper = document.getElementById('tableWrapper');
      const tbody = document.getElementById('requestsTbody');
      const noReq = document.getElementById('noRequestsMsg');

      let filtered = allRequests;
      if (currentFilter !== 'ALL') {
        filtered = allRequests.filter(r => r.status === currentFilter);
      }

      if (filtered.length === 0) {
        wrapper.classList.add('d-none');
        noReq.classList.remove('d-none');
        return;
      }

      wrapper.classList.remove('d-none');
      noReq.classList.add('d-none');

      tbody.innerHTML = filtered.map(r => {
        let badgeClass = 'badge-pending';
        if (r.status === 'ACCEPTED') badgeClass = 'badge-accepted';
        else if (r.status === 'REJECTED') badgeClass = 'badge-rejected';
        else if (r.status === 'CANCELLED') badgeClass = 'badge-cancelled';

        let actionHtml = '';
        if (r.status === 'PENDING') {
          actionHtml = `
            <button class="btn btn-sm btn-success me-1" onclick="acceptRequest(${r.id})">
              <i class="bi bi-check2"></i> Accept
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="rejectRequest(${r.id})">
              <i class="bi bi-x"></i> Reject
            </button>
          `;
        } else if (r.status === 'ACCEPTED') {
          actionHtml = `
            <a href="/alumni-sessions.html" class="btn btn-sm btn-outline-primary">
              <i class="bi bi-calendar-event me-1"></i> Manage Sessions
            </a>
          `;
        }

        return `
          <tr>
            <td class="ps-4">
              <div class="fw-bold">${r.studentName}</div>
              <div class="text-muted small">${r.studentEmail}</div>
            </td>
            <td>
              <div class="small fw-semibold text-secondary">${r.studentDepartment || 'Student'}</div>
            </td>
            <td>
              <span class="d-inline-block text-truncate" style="max-width: 280px;" title="${r.message || ''}">
                ${r.message || 'No note'}
              </span>
            </td>
            <td class="small text-muted">${API.formatDate(r.requestedAt)}</td>
            <td>
              <span class="badge ${badgeClass}">${r.status}</span>
            </td>
            <td class="text-end pe-4 text-nowrap">
              ${actionHtml}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function acceptRequest(id) {
      try {
        await API.put(`/api/mentorship/${id}/accept`);
        API.showToast('Mentorship request accepted!', 'success');
        await loadRequests();
      } catch (err) {
        alert(err.message || 'Failed to accept request.');
      }
    }

    async function rejectRequest(id) {
      if (!confirm('Decline this mentorship request?')) return;
      try {
        await API.put(`/api/mentorship/${id}/reject`);
        API.showToast('Mentorship request declined.', 'info');
        await loadRequests();
      } catch (err) {
        alert(err.message || 'Failed to reject request.');
      }
    }
  </script>
</body>
</html>
