<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mentorship Requests - Alumni Networking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">My Mentorship Requests</h2>
          <p class="text-muted mb-0">Track all mentorship applications sent to alumni mentors.</p>
        </div>
        <a href="/find-mentors.html" class="btn btn-primary">
          <i class="bi bi-search me-1"></i> Find More Mentors
        </a>
      </div>

      <div class="card-custom">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs" id="statusTabs">
            <li class="nav-item">
              <a class="nav-link active" href="javascript:void(0)" onclick="filterRequests('ALL')">All</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('PENDING')">Pending</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('ACCEPTED')">Accepted</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('REJECTED')">Rejected</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="javascript:void(0)" onclick="filterRequests('CANCELLED')">Cancelled</a>
            </li>
          </ul>
        </div>
        <div class="card-body p-0">
          <div id="requestsLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive d-none" id="tableContainer">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Mentor</th>
                  <th>Company & Role</th>
                  <th>Message</th>
                  <th>Date Sent</th>
                  <th>Status</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>

          <div id="noRequests" class="text-center py-5 d-none">
            <i class="bi bi-inbox text-muted fs-1 mb-2"></i>
            <p class="text-muted mb-0">No mentorship requests found in this category.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allRequests = [];
    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['STUDENT', 'ADMIN']);
      if (!user) return;

      API.renderNavbar('requests');
      API.renderSidebar('STUDENT', 'requests');
      await loadRequests();
    });

    async function loadRequests() {
      try {
        allRequests = await API.get('/api/mentorship/student');
        document.getElementById('requestsLoading').classList.add('d-none');
        renderTable();
      } catch (err) {
        document.getElementById('requestsLoading').innerHTML = `<p class="text-danger small">Failed to load requests: ${err.message}</p>`;
      }
    }

    function filterRequests(status) {
      currentFilter = status;
      document.querySelectorAll('#statusTabs .nav-link').forEach(link => {
        link.classList.toggle('active', link.textContent.trim().toUpperCase() === status);
      });
      renderTable();
    }

    function renderTable() {
      const tableContainer = document.getElementById('tableContainer');
      const tbody = document.getElementById('requestsTableBody');
      const noReq = document.getElementById('noRequests');

      let filtered = allRequests;
      if (currentFilter !== 'ALL') {
        filtered = allRequests.filter(r => r.status === currentFilter);
      }

      if (filtered.length === 0) {
        tableContainer.classList.add('d-none');
        noReq.classList.remove('d-none');
        return;
      }

      tableContainer.classList.remove('d-none');
      noReq.classList.add('d-none');

      tbody.innerHTML = filtered.map(r => {
        let badgeClass = 'badge-pending';
        if (r.status === 'ACCEPTED') badgeClass = 'badge-accepted';
        else if (r.status === 'REJECTED') badgeClass = 'badge-rejected';
        else if (r.status === 'CANCELLED') badgeClass = 'badge-cancelled';

        let actionHtml = '';
        if (r.status === 'PENDING') {
          actionHtml = `
            <button class="btn btn-outline-danger btn-sm" onclick="cancelRequest(${r.id})">
              <i class="bi bi-x-circle me-1"></i> Cancel
            </button>
          `;
        } else if (r.status === 'ACCEPTED') {
          actionHtml = `
            <a href="/sessions.html?reqId=${r.id}&mentorName=${encodeURIComponent(r.alumniName)}" class="btn btn-success btn-sm">
              <i class="bi bi-calendar-plus me-1"></i> Schedule Session
            </a>
          `;
        }

        return `
          <tr>
            <td class="ps-4">
              <div class="fw-bold">${r.alumniName}</div>
              <div class="text-muted small">${r.alumniEmail}</div>
            </td>
            <td>
              <div class="fw-semibold">${r.alumniJobRole || 'Alumni'}</div>
              <div class="text-muted small">${r.alumniCompany || 'N/A'}</div>
            </td>
            <td>
              <span class="d-inline-block text-truncate" style="max-width: 260px;" title="${r.message || ''}">
                ${r.message || 'No message'}
              </span>
            </td>
            <td class="small text-muted">${API.formatDate(r.requestedAt)}</td>
            <td>
              <span class="badge ${badgeClass}">${r.status}</span>
            </td>
            <td class="text-end pe-4">
              ${actionHtml}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function cancelRequest(id) {
      if (!confirm('Are you sure you want to cancel this mentorship request?')) return;
      try {
        await API.put(`/api/mentorship/${id}/cancel`);
        API.showToast('Request cancelled.', 'info');
        await loadRequests();
      } catch (err) {
        alert(err.message || 'Failed to cancel request.');
      }
    }
  </script>
</body>
</html>
