<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold mb-1">Manage Students</h2>
          <p class="text-muted mb-0">Review student profiles, academic departments, and manage accounts.</p>
        </div>
        <div class="input-group" style="max-width: 300px;">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchStudent" placeholder="Search students..." oninput="filterStudents()">
        </div>
      </div>

      <div class="card-custom">
        <div class="card-body p-0">
          <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div class="table-responsive d-none" id="tableContainer">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Student</th>
                  <th>Reg No & Dept</th>
                  <th>Grad Year</th>
                  <th>Career Goal</th>
                  <th>Skills</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTbody"></tbody>
            </table>
          </div>

          <div id="noStudents" class="text-center py-5 d-none">
            <i class="bi bi-mortarboard text-muted fs-1 mb-2"></i>
            <p class="text-muted mb-0">No student accounts found.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allStudents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ADMIN']);
      if (!user) return;

      API.renderNavbar('students');
      API.renderSidebar('ADMIN', 'students');
      await loadStudents();
    });

    async function loadStudents() {
      try {
        allStudents = await API.get('/api/admin/students');
        document.getElementById('loading').classList.add('d-none');
        renderTable(allStudents);
      } catch (err) {
        document.getElementById('loading').innerHTML = `<p class="text-danger small">Failed to load students: ${err.message}</p>`;
      }
    }

    function filterStudents() {
      const q = document.getElementById('searchStudent').value.toLowerCase();
      const filtered = allStudents.filter(s =>
        (s.name && s.name.toLowerCase().includes(q)) ||
        (s.email && s.email.toLowerCase().includes(q)) ||
        (s.registerNumber && s.registerNumber.toLowerCase().includes(q)) ||
        (s.department && s.department.toLowerCase().includes(q)) ||
        (s.careerGoal && s.careerGoal.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    function renderTable(list) {
      const container = document.getElementById('tableContainer');
      const tbody = document.getElementById('studentsTbody');
      const noSt = document.getElementById('noStudents');

      if (list.length === 0) {
        container.classList.add('d-none');
        noSt.classList.remove('d-none');
        return;
      }

      container.classList.remove('d-none');
      noSt.classList.add('d-none');

      tbody.innerHTML = list.map(s => `
        <tr>
          <td class="ps-4">
            <div class="fw-bold">${s.name}</div>
            <div class="text-muted small">${s.email}</div>
          </td>
          <td>
            <div class="fw-semibold small">${s.registerNumber || 'N/A'}</div>
            <div class="text-muted small">${s.department || 'N/A'}</div>
          </td>
          <td>
            <span class="badge bg-light text-dark border">${s.graduationYear || 'N/A'}</span>
          </td>
          <td>
            <span class="badge bg-primary-subtle text-primary">${s.careerGoal || 'N/A'}</span>
          </td>
          <td>
            <span class="d-inline-block text-truncate small text-muted" style="max-width: 220px;" title="${s.skills || ''}">
              ${s.skills || 'None'}
            </span>
          </td>
          <td class="text-end pe-4">
            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.userId}, '${s.name}')">
              <i class="bi bi-trash me-1"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteStudent(userId, name) {
      if (!confirm(`Are you sure you want to permanently delete student account: ${name}?`)) return;
      try {
        await API.delete(`/api/admin/users/${userId}`);
        API.showToast('Student account deleted.', 'success');
        await loadStudents();
      } catch (err) {
        alert(err.message || 'Failed to delete user.');
      }
    }
  </script>
</body>
</html>
