<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Professional Profile - Alumni Networking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="dashboard-container">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Professional Profile</h2>
        <p class="text-muted mb-0">Maintain your corporate details and mentoring preferences for college students.</p>
      </div>

      <div class="row">
        <div class="col-lg-8">
          <div class="card-custom">
            <div class="card-header">
              <span><i class="bi bi-briefcase text-primary me-2"></i>Professional Details</span>
            </div>
            <div class="card-body">
              <div id="alert-box" class="alert d-none py-2" role="alert"></div>

              <form id="alumniProfileForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input type="text" class="form-control bg-light" id="name" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Email</label>
                    <input type="email" class="form-control bg-light" id="email" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Current Company *</label>
                    <input type="text" class="form-control" id="company" placeholder="e.g. Google, Microsoft" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Current Job Role *</label>
                    <input type="text" class="form-control" id="jobRole" placeholder="e.g. Senior Software Engineer" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Years of Experience *</label>
                    <input type="number" class="form-control" id="experience" min="0" max="50" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Graduation Year *</label>
                    <input type="number" class="form-control" id="graduationYear" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Department *</label>
                    <input type="text" class="form-control" id="department" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">LinkedIn Profile URL</label>
                    <input type="url" class="form-control" id="linkedinUrl" placeholder="https://linkedin.com/in/username">
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Technical & Domain Skills * (comma-separated)</label>
                    <input type="text" class="form-control" id="skills" placeholder="e.g. Java, Spring Boot, AWS, Microservices" required>
                    <div class="form-text">Used to match with student skills (50% matching weight)</div>
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Areas of Expertise * (comma-separated)</label>
                    <input type="text" class="form-control" id="expertise" placeholder="e.g. Backend Architecture, System Design" required>
                    <div class="form-text">Used to match with student interests (30% matching weight)</div>
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Professional Bio / About</label>
                    <textarea class="form-control" id="bio" rows="3" placeholder="Share your career journey, key projects, and advice for students..."></textarea>
                  </div>
                  <div class="col-12">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="availableForMentoring">
                      <label class="form-check-label small fw-semibold" for="availableForMentoring">
                        Currently available for new student mentorship requests
                      </label>
                    </div>
                  </div>
                </div>

                <div class="mt-4">
                  <button type="submit" id="saveBtn" class="btn btn-primary px-4">
                    <i class="bi bi-check2-circle me-1"></i> Save Changes
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card-custom">
            <div class="card-header">
              <span><i class="bi bi-shield-check text-success me-2"></i>Verification Status</span>
            </div>
            <div class="card-body">
              <div id="verificationCardContent">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.requireAuth(['ALUMNI', 'ADMIN']);
      if (!user) return;

      API.renderNavbar();
      API.renderSidebar('ALUMNI', 'profile');
      await loadProfile();
    });

    async function loadProfile() {
      try {
        const profile = await API.get('/api/alumni/profile');
        document.getElementById('name').value = profile.name || '';
        document.getElementById('email').value = profile.email || '';
        document.getElementById('company').value = profile.company || '';
        document.getElementById('jobRole').value = profile.jobRole || '';
        document.getElementById('experience').value = profile.experience || 0;
        document.getElementById('graduationYear').value = profile.graduationYear || '';
        document.getElementById('department').value = profile.department || '';
        document.getElementById('linkedinUrl').value = profile.linkedinUrl || '';
        document.getElementById('skills').value = profile.skills || '';
        document.getElementById('expertise').value = profile.expertise || '';
        document.getElementById('bio').value = profile.bio || '';
        document.getElementById('availableForMentoring').checked = profile.availableForMentoring;

        const vDiv = document.getElementById('verificationCardContent');
        if (profile.verified) {
          vDiv.innerHTML = `
            <div class="d-flex align-items-center gap-2 text-success fw-bold mb-2">
              <i class="bi bi-patch-check-fill fs-4"></i>
              <span>Account Verified</span>
            </div>
            <p class="small text-muted mb-0">Your alumni credentials have been verified by the college administration. You appear in student mentor searches.</p>
          `;
        } else {
          vDiv.innerHTML = `
            <div class="d-flex align-items-center gap-2 text-warning fw-bold mb-2">
              <i class="bi bi-clock-history fs-4"></i>
              <span>Pending Verification</span>
            </div>
            <p class="small text-muted mb-0">Your profile is awaiting verification by the administrator. Once approved, you will be discoverable by college students.</p>
          `;
        }
      } catch (err) {
        API.showToast('Failed to load profile: ' + err.message, 'danger');
      }
    }

    document.getElementById('alumniProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      alertBox.classList.add('d-none');

      const payload = {
        company: document.getElementById('company').value.trim(),
        jobRole: document.getElementById('jobRole').value.trim(),
        experience: parseInt(document.getElementById('experience').value),
        graduationYear: parseInt(document.getElementById('graduationYear').value),
        department: document.getElementById('department').value.trim(),
        linkedinUrl: document.getElementById('linkedinUrl').value.trim(),
        skills: document.getElementById('skills').value.trim(),
        expertise: document.getElementById('expertise').value.trim(),
        bio: document.getElementById('bio').value.trim(),
        availableForMentoring: document.getElementById('availableForMentoring').checked
      };

      try {
        await API.put('/api/alumni/profile', payload);
        API.showToast('Profile updated successfully!', 'success');
        alertBox.className = 'alert alert-success py-2';
        alertBox.textContent = 'Profile updated successfully!';
        alertBox.classList.remove('d-none');
      } catch (err) {
        alertBox.className = 'alert alert-danger py-2';
        alertBox.textContent = err.message || 'Failed to update profile.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
